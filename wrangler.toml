name = "image-extractor"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
browser = { binding = "BROWSER" }

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true

# 任意：利用者ごとのレート制限（Workers Rate Limiting）。記法は wrangler のバージョンで異なるため公式ドキュメントで確認してください（未検証）。
