<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Website Image Extractor</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--sub:#6b7280;--bd:#e3e6ea;--ac:#2563eb;--act:#fff;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#181b21;--tx:#eceff4;--sub:#9aa3af;--bd:#2a2f38;--ac:#4f8bff;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1115;--card:#181b21;--tx:#eceff4;--sub:#9aa3af;--bd:#2a2f38;--ac:#4f8bff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left);-webkit-text-size-adjust:100%}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}
button,select,input,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px}
button.pri{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.45}
input,select,textarea{font-size:16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;min-height:44px} /* 16px: iOSの入力時自動ズーム防止 */
input[type=checkbox]{min-height:0;width:22px;height:22px;accent-color:var(--ac);vertical-align:middle}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
#url{flex:1;min-width:0}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:12px 0}
details summary{cursor:pointer;color:var(--sub);min-height:32px}textarea{width:100%;min-height:90px;background:var(--bg)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.sub{color:var(--sub);font-size:13px}.err{color:#dc2626}
#pages,#errs{white-space:pre-line;font-size:12px;color:var(--sub)}#errs{max-height:180px;overflow:auto;word-break:break-all}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media(max-width:600px){#grid{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}
@media(min-width:900px){#grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}}
.c{background:var(--card);border:2px solid var(--bd);border-radius:14px;overflow:hidden;position:relative}
.c.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.c .th,.c .ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;width:100%;object-fit:contain;background:repeating-conic-gradient(#8881 0 25%,#0000 0 50%) 0/16px 16px;cursor:zoom-in;font-size:12px;color:var(--sub)}
.c .m{padding:6px 8px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:4px}
.c .ck{position:absolute;top:6px;left:6px;width:32px;height:32px;border-radius:8px}
.c .cp{position:absolute;top:6px;right:6px;padding:2px 10px;min-height:32px;font-size:12px;opacity:.92}
.act{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:5}
@media(max-width:600px){.act button{flex:1 1 30%;padding:10px 6px}}
dialog{border:0;border-radius:14px;padding:12px;max-width:94vw;background:var(--card);color:var(--tx)}dialog img{max-width:100%;max-height:70vh;display:block;margin:0 auto 10px}
dialog::backdrop{background:#000a}
.hrow{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--bd);padding:6px 0;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🖼 Website Image Extractor</h1><button id="theme" aria-label="テーマ切替">🌓</button></header>
<div class="row"><input id="url" type="url" inputmode="url" placeholder="https://example.com/page" autocapitalize="off" autocorrect="off"><button class="pri" id="go">抽出開始</button></div>
<div class="row"><label class="sub"><input type="checkbox" id="spa" checked> JavaScript実行（SPA・無限スクロール）</label>
<label class="sub">最大ページ数 <input id="npages" type="number" min="1" max="10" value="1" style="width:72px"></label>
<button id="cancel" hidden>キャンセル</button><button id="resume" hidden>読み込みを続行</button></div>
<details class="panel"><summary>複数URL・アクセス設定</summary>
<textarea id="urls" placeholder="追加のURL（1行に1件・順番に処理します）"></textarea>
<div class="row"><input id="token" type="password" placeholder="アクセストークン（設定している場合のみ）" style="flex:1" autocomplete="off"></div></details>
<details class="panel"><summary>バックエンドなしで使う（HTMLを貼り付け）</summary>
<div class="row"><input id="baseUrl" style="flex:1" placeholder="基準URL（相対パス解決用）"></div>
<textarea id="html" placeholder="ページのHTMLソースを貼り付け"></textarea>
<div class="row"><button id="goHtml">このHTMLから抽出</button></div></details>
<div id="status" class="sub" role="status"></div><div class="bar" id="barw" hidden><i id="bar"></i></div>
<div id="pages"></div>
<details id="elog"><summary id="esum">エラーログ（0件）</summary><div id="errs"></div></details>
<div id="tools" hidden>
<div class="panel">
<div class="row"><button id="all">すべて選択</button><button id="none">すべて解除</button><button id="inv">選択反転</button>
<label><input type="checkbox" id="selOnly"> 選択済みのみ</label></div>
<div class="row"><select id="grp"><option value="">全URL・全ページ</option></select><select id="fmt"><option value="">全形式</option></select>
<select id="ori"><option value="">全向き</option><option value="p">縦長</option><option value="l">横長</option><option value="s">正方形</option></select>
<select id="sort"><option value="">検出順</option><option value="size">サイズ順</option><option value="res">解像度順</option></select>
<label class="sub">最小辺 <input id="min" type="number" min="0" value="0" style="width:84px">px</label></div>
<div class="row"><label class="sub">ファイル名 <input id="name" value="image" style="width:130px"></label>
<label class="sub"><input type="checkbox" id="seq" checked> 連番にする</label>
<button id="json">JSON出力</button><button id="hsave">履歴に保存</button></div>
<details><summary>抽出履歴（保存はこのブラウザ内のみ・画像データは保存しません）</summary><div id="hist"></div>
<div class="row"><button id="hclear">履歴をすべて削除</button></div></details>
</div>
<div id="count" class="sub" style="margin-bottom:8px"></div>
<div id="grid"></div>
</div>
</div>
<div class="act" id="act" hidden>
<button class="pri" id="zip">ZIP保存</button><button id="zipdone" class="pri" hidden>ZIPを保存／共有</button><button id="each">個別保存</button><button id="share">共有／写真に保存</button>
<span class="sub" id="selc" style="align-self:center"></span></div>
<dialog id="dlg"><img id="pimg" alt=""><div class="row" style="justify-content:center"><button id="ptog"></button><button id="pcopy">URLコピー</button><button id="pclose">閉じる</button></div></dialog>
<script>
const $=s=>document.querySelector(s);
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const CONC=IOS?3:(navigator.hardwareConcurrency>=8?6:4),THUMB=240,MAXITEMS=2000;
let items=[],viewing=null,scanning=false,ac=null,lac=new AbortController(),seen=new Set(),sites=[],srcUrls=[],stats={},errs=[],q=[],active=0,loaded=0,failed=0,cur='',lastZip=null,shareFiles=null,paused=false,pobj=null,capLogged=0;
const hdr=()=>{const t=$('#token').value.trim();return t?{Authorization:'Bearer '+t}:{}};
const px=u=>u.startsWith('data:')?u:`/api/img?url=${encodeURIComponent(u)}`;
const fx=(u,o={})=>fetch(px(u),{...o,headers:hdr()});
const setS=(t,e)=>{$('#status').textContent=t;$('#status').className='sub'+(e?' err':'')};
const prog=p=>{$('#barw').hidden=p==null;$('#bar').style.width=(p||0)+'%'};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=getComputedStyle(r).colorScheme==='dark'?'light':'dark'};
try{$('#token').value=sessionStorage.getItem('ie_tok')||''}catch{}$('#token').onchange=()=>{try{sessionStorage.setItem('ie_tok',$('#token').value)}catch{}};
function logErr(u,m){errs.push(`${new Date().toLocaleTimeString('ja-JP')} ${m} ${u}`);if(errs.length>500)errs.shift();$('#esum').textContent=`エラーログ（${errs.length}件）`;$('#errs').textContent=errs.join('\n')}

// ---- 抽出（静的HTML） ----
function validUrl(s){try{const u=new URL(s);return /^https?:$/.test(u.protocol)&&!u.username?u.href:null}catch{return null}}
function bestSrcset(s){let b=null,bv=-1;(s||'').split(/,\s+|,(?=\S+\s+\d)/).forEach(c=>{const m=c.trim().match(/^(\S+)(?:\s+(\d+(?:\.\d+)?)[wx])?/);if(m){const v=+(m[2]||1);if(v>bv){bv=v;b=m[1]}}});return b}
function extract(html,base){
  const d=new DOMParser().parseFromString(html,'text/html'),set=new Set();
  const add=u=>{if(!u)return;u=u.trim();try{u=u.startsWith('data:image')?u:new URL(u,base).href}catch{return}if(/^(https?:|data:image)/.test(u))set.add(u.split('#')[0])};
  const A=['src','data-src','data-lazy-src','data-original','data-lazy','data-url'],S=['srcset','data-srcset','data-lazy-srcset'];
  d.querySelectorAll('img,source,noscript').forEach(el=>{
    if(el.tagName==='NOSCRIPT'){new DOMParser().parseFromString(el.textContent,'text/html').querySelectorAll('img').forEach(i=>add(bestSrcset(i.srcset)||i.getAttribute('src')));return}
    const ss=S.map(a=>el.getAttribute(a)).find(Boolean),b=ss&&bestSrcset(ss);if(b)add(b);else A.forEach(a=>add(el.getAttribute(a)))});
  const re=/url\(\s*(['"]?)(.*?)\1\s*\)/g,ext=/\.(png|jpe?g|gif|webp|avif|svg|bmp|ico)([?#]|$)/i;
  d.querySelectorAll('[style*="url("]').forEach(el=>{let m;re.lastIndex=0;while(m=re.exec(el.getAttribute('style')))add(m[2])});
  d.querySelectorAll('style').forEach(s=>{let m;re.lastIndex=0;while(m=re.exec(s.textContent))if(ext.test(m[2]))add(m[2])});
  d.querySelectorAll('meta[property="og:image"],meta[name="twitter:image"]').forEach(m=>add(m.content));
  return[...set];
}

// ---- キュー・状態 ----
function reset(){items.forEach(i=>i.thumb&&URL.revokeObjectURL(i.thumb));items=[];seen=new Set();sites=[];srcUrls=[];stats={};errs=[];q=[];active=0;loaded=0;failed=0;cur='';paused=false;capLogged=0;shareFiles=null;lastZip=null;
  lac.abort();lac=new AbortController();$('#zipdone').hidden=true;$('#resume').hidden=true;$('#errs').textContent='';$('#esum').textContent='エラーログ（0件）';$('#tools').hidden=false;$('#act').hidden=false;$('#cancel').hidden=false;render()}
function enqueue(urls,pg,site){for(const u of urls){const k=u.split('#')[0];if(seen.has(k))continue;if(items.length>=MAXITEMS){if(!capLogged){capLogged=1;logErr('','上限（'+MAXITEMS+'枚）に達したため以降は無視します')}break}
  seen.add(k);const it={id:items.length,url:k,site,pg,sel:false};items.push(it);q.push(it);const g=site+'-'+pg;(stats[g]=stats[g]||{site,pg,found:0,ok:0,fail:0}).found++}status();pump()}
function status(){const m=performance.memory?` ／ JS ${Math.round(performance.memory.usedJSHeapSize/1048576)}MB`:'';
  setS(`${cur?cur+' ｜ ':''}検出 ${items.length} ／ 成功 ${loaded} ／ 失敗 ${failed}${m}`);
  $('#pages').textContent=Object.values(stats).map(s=>`${sites[s.site]||'?'} p${s.pg}：検出${s.found} 成功${s.ok} 失敗${s.fail}`).join('\n');
  prog(items.length?(loaded+failed)/items.length*100:0)}
const memHigh=()=>performance.memory&&performance.memory.usedJSHeapSize>performance.memory.jsHeapSizeLimit*.8;
function pump(){
  if(!paused)while(active<CONC&&q.length){
    if(memHigh()){paused=true;$('#resume').hidden=false;setS('メモリ使用量が高いため読み込みを一時停止しました。選択・保存後に「読み込みを続行」を押してください。',1);break}
    const it=q.shift();active++;
    load(it).then(()=>{active--;const s=stats[it.site+'-'+it.pg];if(it.err){failed++;s&&s.fail++}else if(it.type){loaded++;s&&s.ok++}status();schedule();pump()})}
  if(!active&&!q.length&&!scanning&&!paused)finish()}
function finish(){const n=items.filter(i=>i.type).length;cur='';status();
  setS(items.length?`完了：${n}件の画像（失敗 ${failed}件・重複は除去済み）`:'画像が見つかりませんでした。',!items.length);prog();fillFmt();render();if(!ac)$('#cancel').hidden=true}
$('#resume').onclick=()=>{paused=false;$('#resume').hidden=true;pump()};
$('#cancel').onclick=()=>{ac&&ac.abort();lac.abort();q.length=0;paused=false};

// ---- 画像読込：サムネイルのみ保持し元データは即破棄 ----
async function load(it){
  try{const r=await fx(it.url,{signal:lac.signal});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||('HTTP '+r.status))}
    const b=await r.blob();if(!b.type.startsWith('image/'))throw new Error('画像ではありません');
    it.size=b.size;it.type=b.type;await thumb(it,b)}
  catch(e){if(e.name==='AbortError')return;it.err=1;logErr(it.url,e.message)}
}
function thumb(it,b){return new Promise(res=>{const o=URL.createObjectURL(b),i=new Image(),bad=()=>{URL.revokeObjectURL(o);it.nothumb=1;res()};
  i.onload=()=>{it.w=i.naturalWidth;it.h=i.naturalHeight;if(!it.w){it.thumb=o;return res()}
    try{const s=Math.min(1,THUMB/Math.max(it.w,it.h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(it.w*s));c.height=Math.max(1,Math.round(it.h*s));
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);
      c.toBlob(t=>{URL.revokeObjectURL(o);if(!t){it.nothumb=1}else it.thumb=URL.createObjectURL(t);c.width=c.height=0;res()},'image/jpeg',.7)}catch{bad()}};
  i.onerror=bad;i.src=o})}

// ---- 実行（複数URLを順番に処理） ----
$('#go').onclick=async()=>{
  if(scanning||ac)return;
  const raw=[...new Set([$('#url').value,...$('#urls').value.split('\n')].map(s=>s.trim()).filter(Boolean))];
  const list=raw.map(validUrl);if(!raw.length||list.every(x=>!x))return setS('有効なURL（http または https）を入力してください。',1);
  reset();scanning=true;ac=new AbortController();
  try{for(let k=0;k<raw.length&&!ac.signal.aborted;k++){
    if(!list[k]){logErr(raw[k],'URLが不正です');continue}
    const idx=sites.length;sites.push(new URL(list[k]).hostname);srcUrls.push(list[k]);cur=`URL ${k+1}/${raw.length} を処理中`;status();
    try{await scanOne(list[k],idx)}catch(e){if(e.name==='AbortError')break;logErr(list[k],e.message);setS('取得に失敗：'+e.message+'（次のURLへ進みます）',1)}}}
  finally{scanning=false;ac=null;pump()}
};
async function scanOne(u,idx){
  if($('#spa').checked){
    const r=await fetch(`/api/scan?url=${encodeURIComponent(u)}&pages=${Math.min(10,Math.max(1,+$('#npages').value||1))}`,{signal:ac.signal,headers:hdr()});
    if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||('HTTP '+r.status));
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(!line)continue;let m;try{m=JSON.parse(line)}catch{continue}
        if(m.t==='progress'){cur=m.msg;status()}else if(m.t==='images')enqueue(m.urls,m.page,idx);else if(m.t==='error')throw new Error(m.msg)}}
  }else{
    const r=await fetch(`/api/page?url=${encodeURIComponent(u)}`,{signal:ac.signal,headers:hdr()});const j=await r.json();if(!r.ok)throw new Error(j.error);
    enqueue(extract(j.html,j.url),1,idx)}
}
$('#goHtml').onclick=()=>{const b=validUrl($('#baseUrl').value.trim());if(!b)return setS('基準URLを入力してください。',1);reset();sites.push(new URL(b).hostname);srcUrls.push(b);enqueue(extract($('#html').value,b),1,0)};

// ---- 表示 ----
const fmtOf=i=>(i.type||'').split('/')[1]?.replace('svg+xml','svg').replace('jpeg','jpg').replace('x-icon','ico')||'';
const kb=n=>n>1048576?(n/1048576).toFixed(1)+'MB':Math.round(n/1024)+'KB';
function fillFmt(){const s=$('#fmt'),c=s.value;s.length=1;[...new Set(items.filter(i=>i.type).map(fmtOf))].forEach(f=>s.add(new Option(f.toUpperCase(),f)));s.value=c;
  const g=$('#grp'),gc=g.value;g.length=1;sites.forEach((h,i)=>{g.add(new Option(h,'s:'+i));Object.values(stats).filter(t=>t.site===i).forEach(t=>g.add(new Option(`　${h} p${t.pg}`,'p:'+i+'-'+t.pg)))});g.value=gc}
function view(){
  let v=items.filter(i=>!i.err&&i.type);const f=$('#fmt').value,o=$('#ori').value,m=+$('#min').value||0,g=$('#grp').value;
  if(g)v=v.filter(i=>g[0]==='s'?i.site===+g.slice(2):(i.site+'-'+i.pg)===g.slice(2));
  if(f)v=v.filter(i=>fmtOf(i)===f);
  if(o)v=v.filter(i=>i.w&&(o==='s'?Math.abs(i.w-i.h)/Math.max(i.w,i.h)<.05:o==='p'?i.h>i.w*1.05:i.w>i.h*1.05));
  if(m)v=v.filter(i=>!i.w||Math.min(i.w,i.h)>=m);
  if($('#selOnly').checked)v=v.filter(i=>i.sel);
  const s=$('#sort').value;if(s==='size')v.sort((a,b)=>b.size-a.size);if(s==='res')v.sort((a,b)=>(b.w*b.h||0)-(a.w*a.h||0));
  return v}
let tm;const schedule=()=>{if(!tm)tm=setTimeout(()=>{tm=0;render()},500)};
function render(){
  const v=view(),g=$('#grid');g.textContent='';
  v.forEach(it=>{const c=document.createElement('div');c.className='c'+(it.sel?' sel':'');
    c.innerHTML='<input type="checkbox" class="ck" aria-label="選択"><button class="cp">URL</button><div class="m"><span></span><span></span></div>';
    const ck=c.querySelector('.ck');ck.checked=it.sel;ck.onchange=()=>{it.sel=ck.checked;c.classList.toggle('sel',it.sel);counts()};
    let th;if(it.thumb){th=document.createElement('img');th.className='th';th.loading='lazy';th.alt='';th.src=it.thumb}else{th=document.createElement('div');th.className='ph';th.textContent='プレビュー不可'}
    th.onclick=()=>preview(it);c.prepend(th);
    c.querySelector('.cp').onclick=()=>copy(it.url);
    const [a,b]=c.querySelectorAll('.m span');a.textContent=it.w?`${it.w}×${it.h}`:'—';b.textContent=`${fmtOf(it).toUpperCase()} ${kb(it.size)}`;g.append(c)});
  $('#count').textContent=`表示 ${v.length} 件 ／ 検出 ${items.filter(i=>i.type).length} 件`;counts()}
const sels=()=>items.filter(i=>i.sel&&i.type);
function counts(){const n=sels().length;$('#selc').textContent=`選択 ${n} 枚`;['zip','each','share'].forEach(k=>$('#'+k).disabled=!n);if(shareFiles){shareFiles=null;$('#share').textContent='共有／写真に保存'}}
['fmt','ori','sort','min','selOnly','grp'].forEach(k=>$('#'+k).addEventListener('change',render));
$('#all').onclick=()=>{view().forEach(i=>i.sel=true);render()};
$('#none').onclick=()=>{view().forEach(i=>i.sel=false);render()};
$('#inv').onclick=()=>{view().forEach(i=>i.sel=!i.sel);render()};
async function copy(t){try{await navigator.clipboard.writeText(t);setS('URLをコピーしました。')}catch{prompt('URLをコピーしてください',t)}}
async function preview(it){viewing=it;$('#pimg').removeAttribute('src');upd();$('#dlg').showModal(); // 拡大時のみ元画像を取得し、閉じたら解放
  try{const r=await fx(it.url);const b=await r.blob();if(viewing===it&&$('#dlg').open){pobj=URL.createObjectURL(b);$('#pimg').src=pobj}}catch{}}
$('#dlg').addEventListener('close',()=>{if(pobj){URL.revokeObjectURL(pobj);pobj=null}$('#pimg').removeAttribute('src');viewing=null});
const upd=()=>$('#ptog').textContent=viewing.sel?'選択を解除':'選択する';
$('#ptog').onclick=()=>{viewing.sel=!viewing.sel;upd();render()};
$('#pcopy').onclick=()=>copy(viewing.url);$('#pclose').onclick=()=>$('#dlg').close();

// ---- 保存 ----
const clean=s=>s.replace(/[\u0000-\u001f\\/:*?"<>|]/g,'_').replace(/^\.+/,'').slice(0,100)||'image';
function names(list){
  const b=clean($('#name').value.trim()||'image'),seq=$('#seq').checked,used=new Set(),pad=String(list.length).length<3?3:String(list.length).length;
  return list.map((it,i)=>{const ext=fmtOf(it)||'img';let n;
    if(seq)n=`${b}-${String(i+1).padStart(pad,'0')}.${ext}`;
    else{let o='';try{o=decodeURIComponent(new URL(it.url).pathname.split('/').pop())}catch{}o=clean(o.replace(/\.[^.]+$/,''))||b;n=`${o}.${ext}`;for(let k=2;used.has(n);k++)n=`${o}-${k}.${ext}`}
    used.add(n);return n})}
//ZIP-START
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
// ストリーミングZIP：画像は取得しながらチャンク単位で書き出す（データディスクリプタ方式）
async function zipStream(list,nm,sink,o={}){
  const te=new TextEncoder(),cd=[],failed=[];let off=0;
  if(list.length>65000)throw new Error('ZIPに含められる枚数の上限（65,000枚）を超えています');
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  const put=async u=>{await sink.write(u);off+=u.length;if(off>0xF0000000)throw new Error('ZIPが4GBを超えるため中止しました')};
  const chk=()=>{if(o.signal&&o.signal.aborted)throw new DOMException('aborted','AbortError')};
  async function entry(name,first,rd){
    chk();const n=te.encode(name),start=off,h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0808,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint16(26,n.length,true);
    await put(new Uint8Array(h.buffer));await put(n);
    let c=~0,size=0,r=first;
    while(!r.done){chk();const u=r.value;await put(u);for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);size+=u.length;r=await rd.read()}
    const crcv=~c>>>0,x=new DataView(new ArrayBuffer(16));x.setUint32(0,0x08074b50,true);x.setUint32(4,crcv,true);x.setUint32(8,size,true);x.setUint32(12,size,true);
    await put(new Uint8Array(x.buffer));cd.push({n,crc:crcv,size,start});
  }
  let ok=0;
  for(let i=0;i<list.length;i++){
    chk();let rd,first;
    try{const body=list[i].open?await list[i].open():list[i].blob.stream();rd=body.getReader();first=await rd.read()}
    catch(e){if(e.name==='AbortError')throw e;failed.push(`${nm[i]}\t${list[i].url}\t${e.message}`);o.onp&&o.onp(i+1,list.length);continue} // ヘッダ書込み前に読めない画像は除外（ZIPを壊さない）
    await entry(nm[i],first,rd);ok++;o.onp&&o.onp(i+1,list.length);
  }
  if(failed.length){const b=te.encode('失敗した画像\n'+failed.join('\n')+'\n');await entry('_failed.txt',{done:false,value:b},{read:async()=>({done:true})})}
  const cs=off;
  for(const e of cd){const v=new DataView(new ArrayBuffer(46));v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(8,0x0808,true);v.setUint16(12,dt,true);v.setUint16(14,dd,true);v.setUint32(16,e.crc,true);v.setUint32(20,e.size,true);v.setUint32(24,e.size,true);v.setUint16(28,e.n.length,true);v.setUint32(42,e.start,true);await put(new Uint8Array(v.buffer));await put(e.n)}
  const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,cd.length,true);end.setUint16(10,cd.length,true);end.setUint32(12,off-cs,true);end.setUint32(16,cs,true);await put(new Uint8Array(end.buffer));
  return{ok,failed};
}
async function makeSink(fname){
  if(typeof window!=='undefined'&&window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:fname,types:[{description:'ZIP',accept:{'application/zip':['.zip']}}]});const w=await h.createWritable();
    return{write:u=>w.write(u),close:async()=>{await w.close()},abort:()=>w.abort()}}catch(e){if(e.name==='AbortError')throw e}} // 対応ブラウザではディスクへ直接書き出し
  let parts=[],n=0; // 非対応（iOS Safari等）：一定量ごとにBlobへ畳み込む
  return{write:async u=>{parts.push(u);n+=u.length;if(n>(32<<20)){parts=[new Blob(parts)];n=0}},close:async()=>new Blob(parts,{type:'application/zip'}),abort:async()=>{parts=[]}}
}
//ZIP-END
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
$('#zip').onclick=async()=>{
  if(scanning||ac)return;const l=sels(),nm=names(l),fn=clean($('#name').value||'images')+'.zip';let sink;
  ac=new AbortController();$('#cancel').hidden=false;lastZip=null;$('#zipdone').hidden=true;
  try{sink=await makeSink(fn);setS('ZIP生成中…');
    const list=l.map(it=>({url:it.url,open:async()=>{const r=await fx(it.url,{signal:ac.signal});if(!r.ok)throw new Error('HTTP '+r.status);return r.body}}));
    const r=await zipStream(list,nm,sink,{signal:ac.signal,onp:(i,t)=>{prog(i/t*100);setS(`ZIP生成中 ${i}/${t}`)}});
    const out=await sink.close();
    r.failed.forEach(f=>logErr(f.split('\t')[1],'ZIPから除外：'+f.split('\t')[2]));
    const note=r.failed.length?`（失敗${r.failed.length}枚は _failed.txt に記録）`:'';
    if(out instanceof Blob){lastZip={blob:out,name:fn};
      if(IOS){$('#zipdone').hidden=false;setS(`ZIP完成：${r.ok}枚・${kb(out.size)}${note}。「ZIPを保存／共有」を押してください。`)}
      else{save(out,fn);setS(`ZIP完了：${r.ok}枚${note}`)}}
    else setS(`ZIP完了：${r.ok}枚${note}`);
  }catch(e){try{sink&&await sink.abort()}catch{}lastZip=null;setS(e.name==='AbortError'?'ZIP生成をキャンセルしました（未完成ファイルは破棄）。':'ZIP生成に失敗しました：'+e.message,e.name!=='AbortError');if(e.name!=='AbortError')logErr('',e.message)}
  finally{ac=null;if(!active&&!q.length)$('#cancel').hidden=true;prog()}};
$('#zipdone').onclick=async()=>{if(!lastZip)return;const f=new File([lastZip.blob],lastZip.name,{type:'application/zip'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}save(lastZip.blob,lastZip.name)};
$('#each').onclick=async()=>{const l=sels(),nm=names(l);ac=new AbortController();$('#cancel').hidden=false;
  try{for(let i=0;i<l.length;i++){const r=await fx(l[i].url,{signal:ac.signal});if(!r.ok){logErr(l[i].url,'HTTP '+r.status);continue}save(await r.blob(),nm[i]);setS(`個別保存中 ${i+1}/${l.length}`);prog((i+1)/l.length*100);await wait(IOS?900:350)}setS('個別保存が完了しました。')}
  catch(e){setS(e.name==='AbortError'?'個別保存をキャンセルしました。':'個別保存に失敗：'+e.message,e.name!=='AbortError')}finally{ac=null;if(!active&&!q.length)$('#cancel').hidden=true;prog()}};
// 共有：iOSはユーザー操作直後でないと共有できないため「準備→共有を開く」の2段階
$('#share').onclick=async()=>{
  if(shareFiles){const f=shareFiles;shareFiles=null;$('#share').textContent='共有／写真に保存';try{await navigator.share({files:f});setS('共有しました（iOSでは「画像を保存」で写真アプリへ保存できます）。')}catch(e){if(e.name!=='AbortError')setS('共有に失敗：'+e.message,1)}return}
  const l=sels();if(l.length>20)return setS('共有は一度に20枚までです。ZIP保存をご利用ください。',1);
  if(!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'a.png',{type:'image/png'})]})))return setS('この環境ではファイル共有に対応していません。ZIPまたは個別保存をご利用ください。',1);
  setS('共有用に画像を準備中…');const nm=names(l),fs=[];let total=0;
  try{for(let i=0;i<l.length;i++){const r=await fx(l[i].url);if(!r.ok)throw new Error('HTTP '+r.status);const b=await r.blob();total+=b.size;if(total>(60<<20))throw new Error('合計60MBを超えるため中止しました');fs.push(new File([b],nm[i],{type:b.type}))}}
  catch(e){return setS('共有の準備に失敗：'+e.message,1)}
  shareFiles=fs;$('#share').textContent=`共有を開く（${fs.length}枚）`;setS('準備完了。もう一度ボタンを押すと共有メニューが開きます。')};

// ---- JSON出力・履歴（保存はユーザー操作時のみ） ----
function snapshot(){const list=items.filter(i=>i.type);return{generatedAt:new Date().toISOString(),
  sources:srcUrls.map((u,i)=>({url:u,pages:Object.values(stats).filter(s=>s.site===i).map(s=>({page:s.pg,found:s.found,ok:s.ok,fail:s.fail}))})),
  images:list.map(i=>({url:i.url,source:srcUrls[i.site],page:i.pg,width:i.w||null,height:i.h||null,bytes:i.size,type:i.type,selected:i.sel})),errors:errs}}
$('#json').onclick=()=>{const o=snapshot();if(items.some(i=>i.sel))o.images=o.images.filter(i=>i.selected);save(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),'result.json')};
const HK='ie_hist',hget=()=>{try{return JSON.parse(localStorage.getItem(HK)||'[]')}catch{return[]}};
function renderHist(){const h=$('#hist');h.textContent='';const l=hget();if(!l.length){h.textContent='履歴はありません。';return}
  l.forEach((e,i)=>{const r=document.createElement('div');r.className='hrow';const t=document.createElement('span');t.textContent=`${new Date(e.at).toLocaleString('ja-JP')} ／ ${e.urls.length}URL ／ ${e.count}枚`;
    const b=document.createElement('button');b.textContent='URLを再入力';b.onclick=()=>{$('#url').value=e.urls[0]||'';$('#urls').value=e.urls.slice(1).join('\n')};
    const d=document.createElement('button');d.textContent='削除';d.onclick=()=>{const a=hget();a.splice(i,1);try{localStorage.setItem(HK,JSON.stringify(a))}catch{}renderHist()};
    r.append(t,b,d);h.append(r)})}
$('#hsave').onclick=()=>{const s=snapshot();if(!s.images.length)return setS('保存する結果がありません。',1);
  try{const a=hget();a.unshift({at:s.generatedAt,urls:srcUrls,count:s.images.length,data:s});localStorage.setItem(HK,JSON.stringify(a.slice(0,20)));setS('履歴に保存しました（URLとメタ情報のみ・画像データは含みません）。');renderHist()}
  catch{setS('履歴を保存できませんでした（容量不足またはブラウザ設定）。',1)}};
$('#hclear').onclick=()=>{try{localStorage.removeItem(HK)}catch{}renderHist()};
renderHist();
addEventListener('pagehide',()=>{items.forEach(i=>i.thumb&&URL.revokeObjectURL(i.thumb))});
</script>
